# Builds Brain Bento for iPhone on Codemagic's Macs and sends it to TestFlight.
#
# Before the first build (one time, see the guide):
#   1. Codemagic → Integrations → Developer Portal → Manage keys → add your App Store Connect API key
#      and name it exactly:  Brain Bento ASC
#   2. Codemagic → codemagic.yaml settings → Code signing identities:
#      generate an Apple Distribution certificate, then fetch the App Store profile for com.playbentobrain.app.
# Then press "Start new build" and pick this workflow.
workflows:
  ios-testflight:
    name: Brain Bento → TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 45
    integrations:
      app_store_connect: Brain Bento ASC
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.playbentobrain.app
      node: 22
      xcode: latest
    scripts:
      - name: Install Capacitor
        script: npm ci
      - name: Copy the games into the iOS project
        script: npx cap sync ios
      - name: Use the signing files
        script: xcode-project use-profiles
      - name: Give this build a new number
        script: |
          sed -i '' "s/CURRENT_PROJECT_VERSION = [0-9]*;/CURRENT_PROJECT_VERSION = $BUILD_NUMBER;/g" ios/App/App.xcodeproj/project.pbxproj
          grep -m1 "CURRENT_PROJECT_VERSION" ios/App/App.xcodeproj/project.pbxproj
      - name: Build the app
        script: xcode-project build-ipa --project ios/App/App.xcodeproj --scheme App
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
